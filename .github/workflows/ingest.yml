name: Ingest WHV Jobs & Publish to Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-jobs-ingest"
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit & contract tests
        run: npm test

      - name: Download previous jobs.json from GitHub Pages (if deployed)
        continue-on-error: true
        env:
          PREVIOUS_JOBS_URL: ${{ vars.JOBS_JSON_URL || 'https://guicoutinho-dev.github.io/WHVHELP/jobs.json' }}
        run: |
          if [ -n "$PREVIOUS_JOBS_URL" ]; then
            mkdir -p data
            curl -fsSL "$PREVIOUS_JOBS_URL" -o data/jobs.json || true
          fi

      - name: Run ingestion pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -n "$ADZUNA_APP_ID" ] || [ -n "$JOOBLE_API_KEY" ] || [ -n "$FIRECRAWL_API_KEY" ]; then
            npm run ingest
          elif [ ! -f data/jobs.json ]; then
            echo "No API secrets configured yet; generating initial seed jobs.json"
            npm run ingest:seed
          fi
          if [ ! -f data/employers.json ]; then
            npm run ingest:employers
          fi
          if [ ! -f data/accommodation.json ]; then
            npm run ingest:accommodation
          fi

      - name: Commit updated data/jobs.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/employers.json data/accommodation.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update WHV jobs.json [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages (when enabled on repository)
        id: pages_config
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload data artifact for GitHub Pages
        if: steps.pages_config.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "data"

      - name: Deploy to GitHub Pages
        if: steps.pages_config.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
